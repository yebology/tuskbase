# Tuskbase — Docker Compose (Backend + Frontend + Database)
# Usage: docker compose up -d

services:
  # --- Database (PostgreSQL) ---
  postgres:
    image: postgres:16-alpine
    container_name: tuskbase-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tuskbase
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --- Backend (Node.js + Hono) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tuskbase-backend
    restart: unless-stopped
    ports:
      - "8080:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tuskbase
    depends_on:
      - postgres

  # --- Frontend (Next.js) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: tuskbase-frontend
    restart: unless-stopped
    ports:
      - "3005:3000"
    depends_on:
      - backend

volumes:
  pgdata:
